name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # A magyar idézőjel („ ”) záró jelét ASCII "-re elgépelve a Kotlin sztring
  # lezáratlan marad: fordítási hiba, amit eddig csak a teljes Android build
  # mutatott meg. Ez a lépés másodpercek alatt kifogja.
  text:
    name: Szöveg-ellenőrzés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-text.js
      # A Compose-fájlokat (hu.breaker.app.ui) csak a teljes Android build
      # fordítja, ami percekbe telik — egy hiányzó import a saját mag-
      # típusainkra itt másodpercek alatt kiderül.
      - run: node scripts/check-kotlin-imports.js
      # A három mag ugyanazt a szabályrendszert futtatja; ha a számok
      # szétcsúsznak, a felhasználó ugyanazt az appot kapja két különböző
      # szigorúsággal, és semmi nem jelzi.
      - run: node scripts/check-core-sync.js
      # Az „Új csomag” gomb egy kiadáson át NEM CSINÁLT SEMMIT: a jelölés
      # megvolt, a kezelő nem. Semmi nem hasalt el tőle — se fordítás, se
      # teszt —, csak a gomb nem működött. Ez a lépés pont ezt fogja ki.
      - run: node scripts/check-ui-wiring.js

  desktop:
    name: Desktop mag + tesztek
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  # A renderert semmi más nem futtatja: egy hiányzó .js kiterjesztés vagy egy
  # null elem-lekérés némán üres ablakot ad. Ez betölti és végigkattintja.
  ui-smoke:
    name: Renderer füstteszt (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ui-shots.js --check
      # A bővítmény beállítási lapja ugyanabban a böngészőben, ugyanabból a
      # telepítésből — külön futóért nem éri meg egy tíz másodperces ellenőrzés.
      - run: node scripts/extension-ui.js
      # A letöltőoldal ugyanabban a böngészőben. Ez az a lap, amit a
      # felhasználó ELŐSZÖR lát — ha a download.js elhasal, üres oldalt kap.
      - run: node scripts/website-shot.js --check

  sync-server:
    name: Szinkron-kiszolgáló tesztek
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Nincs npm ci: a kiszolgálónak szándékosan nincs függősége.
      - run: npm test

  android-core-tests:
    name: Android mag tesztek (JVM, SDK nélkül)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/jvm-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test --no-daemon

  ios-build:
    name: iOS fordítás (aláírás nélkül)
    runs-on: macos-latest
    # A Swift magot eddig CSAK a kiadási munkafolyamat fordította — vagyis egy
    # fordítási hiba napokig bent maradhatott, és csak kiadáskor derült volna
    # ki. Ez a job minden push-nál lefordítja, aláírás nélkül.
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Projekt generálása
        working-directory: ios
        run: xcodegen generate
      - name: Fordítás
        working-directory: ios
        run: |
          xcodebuild -project Breaker.xcodeproj -scheme BreakerApp-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build \
            CODE_SIGNING_ALLOWED=NO | tail -40

  android-build:
    name: Android build (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --no-daemon
