name: Release

# Új verzió kiadása: nyomj egy verziócímkét, a többi automatikus.
#   git tag v0.2.0 && git push origin v0.2.0
#
# Létrejön egy GitHub Release a telepítőkkel, és a már telepített appok
# (asztali + Android közvetlen terjesztés) automatikusan felfrissülnek rá.

on:
  push:
    tags: ["v*"]
  # Kézi indítás is: Actions -> Release -> Run workflow -> verzió megadása.
  # Ugyanazt csinálja, mint a címke-push, csak nem kell hozzá terminál.
  workflow_dispatch:
    inputs:
      version:
        description: "Verziócímke (pl. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  # Címke-pushnál a címke neve, kézi indításnál a megadott verzió.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  prepare:
    name: Draft release létrehozása
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Breaker $VERSION" \
              --notes-file - <<'NOTES'
          ## Mi újság ebben a verzióban

          **Adag-szabály: ennyi használat után ennyi szünet.** Beállíthatod
          egy oldalra, hogy adott aktív használat után adott időre magától
          visszazárjon, aztán újra kinyíljon — például 2 perc Gemini után
          10 perc szünet. A napi keret testvére: a keret a napi összesenről
          szól, ez arról, hogy egyszerre mennyi fér.

          Így működik: az Oldalak fülön az oldal sorában az **Adag** gombbal
          állítod be a két számot. A tiltás DNS-szinten történik, tehát
          minden böngészőben és appban él (gépen és Androidon — az iPhone
          nem mér előteret, ott ez a szabály nem érvényesül, és ezt
          kimondjuk). Ha egy szünetnyi ideig nem használod az oldalt, a
          számláló tiszta lappal indul. A sorban látszik, mennyi fér még az
          adagba; hűtésnél visszaszámol.

          A szabály iránya a megszokott: bevezetni vagy szigorítani egy
          kattintás, **nagyobb adag, rövidebb szünet vagy a levétel
          próbatételbe kerül** — a futó hűtést pedig a csere sem engedi el.
          A beállítás a fiókodon át a többi eszközre is átér; a számláló
          eszközönkénti, és ezt is kimondjuk (a szinkron tízperces körei egy
          kétperces adaghoz túl lassúk lennének).

          ### Ami a v0.4.12-ben jött

          **A csatorna-szűrőid átérnek a többi gépedre.** Eddig a szűrők csak
          azon a gépen éltek, ahol felvetted őket. Mostantól — ha be vagy
          jelentkezve a fiókodba — a fiókon át a többi gépedre is átérnek,
          végponttól végpontig titkosítva, és ott a saját böngésző-bővítményük
          érvényesíti ugyanazt a listát. A szabály a megszokott: lazítani
          (kikapcsolni, új csatornát engedni) csak próbatétellel lehet, és ez
          a szinkronon át sem kerülhető meg — egy régi állapot visszajátszása
          vagy egy vadonatúj, üres gép nem töröl és nem lazít semmit.

          Ha a fiókkiszolgálód régebbi verzió, a szűrők nem érnek át — ezt az
          app kiírja a fiókkártyán, nem hallgatja el. A kiszolgáló frissítése:
          ha az appból indítod, magától frissül az app frissítésével; ha
          Dockerben fut, húzd újra a képet.

          #### Ami a v0.4.11-ben jött

          **Csatorna-idő: melyik csatorna vitte az időt?** Ahol bekapcsolt
          csatorna-szűrő van, a bővítmény mostantól méri is, melyik csatorna
          mennyi időt visz — másodpercre, de csak amíg a lap ténylegesen
          előtérben van. A listák (ma + elmúlt 7 nap) a bővítmény beállítási
          lapján állnak. Máshol nem gyűjt semmit, és az adat a gépeden marad:
          nem megy se az appba, se a fiókba.

          **Élő próba a szűrő űrlapján.** Mentés előtt beilleszthetsz egy
          címet, és azonnal kiderül, mit tenne vele a szűrő — megfogná-e, és
          ha nem, miért nem: engedélyezett csatorna, nem ide szóló cím, vagy
          nem csatorna-alakú cím. A lejátszó-címeknél azt is kimondja, hogy
          ott böngészés közben a lap adata (a feltöltő) dönt.

          A bővítményt a böngésző nem frissíti magától: töltsd le az új
          `Breaker-bovitmeny` zipet, csomagold ki a régi helyére, és a
          `chrome://extensions` lapon nyomj rá frissítést. Ha a v0.4.9-es
          zipet töltötted be és hibát kaptál, ez a zip a javított — a hibáról
          lentebb, a v0.4.10-nél.

          NOTES
          fi

  desktop:
    name: Asztali telepítő (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Verzió beállítása a tagből
        shell: bash
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - name: Build + publish (electron-builder)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # FIGYELEM: az aláíró változókat NEM közvetlenül a hivatalos nevükön
          # adjuk át. A GitHub a hiányzó secretet üres sztringre állítja, az
          # electron-builder viszont csak azt nézi, hogy DEFINIÁLVA van-e a
          # CSC_LINK — üresen is tanúsítványként próbálja megnyitni, és a build
          # „not a file” hibával elszáll. Ezért saját néven jönnek be, és csak
          # akkor exportáljuk őket, ha tényleg van értékük.
          SIGN_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SIGN_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SIGN_WIN_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGN_WIN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$SIGN_CSC_LINK" ]; then
              export CSC_LINK="$SIGN_CSC_LINK"
              export CSC_KEY_PASSWORD="$SIGN_CSC_KEY_PASSWORD"
            else
              # Aláírás nélkül ne is keressen tanúsítványt a kulcskarikán.
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
            if [ -n "$SIGN_APPLE_ID" ]; then
              export APPLE_ID="$SIGN_APPLE_ID"
              export APPLE_APP_SPECIFIC_PASSWORD="$SIGN_APPLE_APP_SPECIFIC_PASSWORD"
              export APPLE_TEAM_ID="$SIGN_APPLE_TEAM_ID"
            fi
          else
            if [ -n "$SIGN_WIN_CSC_LINK" ]; then
              export CSC_LINK="$SIGN_WIN_CSC_LINK"
              export CSC_KEY_PASSWORD="$SIGN_WIN_CSC_KEY_PASSWORD"
            fi
          fi
          npm run dist -- --publish always
      # Az electron-builder publishere CSENDBEN kihagyja a feltöltést, ha a
      # release már nem draft („existing type not compatible”) — a job attól
      # még sikeresnek látszik, és a kiadáson egy korábbi build fájljai
      # maradnak. Pontosan ez történt a v0.1.1-nél: egy megszakított futás
      # feltöltötte az aláíratlan DMG-ket, az újraépítés jóit meg eldobta.
      # Ezért a build UTÁN mindig felül is írjuk, amit most építettünk —
      # ugyanazzal a --clobber feltöltéssel, amit az Android job is használ.
      - name: Assetek feltöltése (felülírással)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sima POSIX-glob, semmi bashizmus: a macOS futtatók /bin/bash-a 3.2,
          # ott nincs mapfile.
          set -eu
          cd release
          installers=0
          for f in *.dmg *.exe *-mac.zip *.blockmap latest*.yml; do
            [ -f "$f" ] || continue          # a nem illeszkedő glob önmagát adja
            # A szóközös nevet a GitHub pontokra cseréli, az electron-builder
            # publishere viszont kötőjelesre — így UGYANAZ a telepítő kétszer
            # került fel, két néven (v0.1.2). Előbb kötőjelesítünk, hogy a
            # --clobber tényleg ugyanarra az assetre üssön.
            case "$f" in
              *\ *) t=$(echo "$f" | tr " " "-"); mv -f "$f" "$t"; f="$t" ;;
            esac
            case "$f" in *.dmg|*.exe) installers=$((installers + 1)) ;; esac
            echo "feltöltés: $f"
            gh release upload "$VERSION" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          [ "$installers" -gt 0 ] || { echo "nem épült telepítő" >&2; exit 1; }
          # A frissítés ezen a manifesten áll vagy bukik; ha nincs, ne adjunk ki
          # olyan verziót, amire a telepített appok nem tudnak felfrissülni.
          ls latest*.yml >/dev/null

  extension:
    name: Böngésző-bővítmény (zip)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Csomagolatlanul is betölthető a mappa, de csak akkor, ha valaki
      # klónozza a projektet. Egy zip a kiadás mellé annyit jelent, hogy a
      # letöltőoldalról is elérhető — enélkül a funkció papíron létezne.
      - name: Zip
        run: |
          cd extension
          zip -r "../Breaker-bovitmeny-${VERSION}.zip" . -x '*.DS_Store'
      - name: Feltöltés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$VERSION" "Breaker-bovitmeny-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android APK + AAB
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Aláíró kulcs visszaállítása (ha van secret)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi
      - run: chmod +x gradlew
      - name: Build (APK a közvetlen terjesztéshez, AAB a Play Store-hoz)
        env:
          BREAKER_KEYSTORE: ${{ steps.keystore.outputs.path }}
          BREAKER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BREAKER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BREAKER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BREAKER_VERSION_NAME: ${{ env.VERSION }}
          BREAKER_VERSION_CODE: ${{ github.run_number }}
        run: |
          export BREAKER_VERSION_NAME="${BREAKER_VERSION_NAME#v}"
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Assetek átnevezése és feltöltése
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n1)
          cp "$APK" "Breaker-${VERSION}.apk"
          gh release upload "$VERSION" "Breaker-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          if [ -n "$AAB" ]; then
            cp "$AAB" "Breaker-${VERSION}.aab"
            gh release upload "$VERSION" "Breaker-${VERSION}.aab" --repo "$GITHUB_REPOSITORY" --clobber
          fi
      # Opcionális: automatikus Play Store feltöltés az internal track-re. Csak
      # akkor fut, ha be van állítva a PLAY_SERVICE_ACCOUNT_JSON secret.
      - name: Play Store feltöltés (ha van service account)
        if: ${{ env.PLAY_JSON != '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: hu.breaker.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

  ios:
    name: iOS/macOS archívum (best-effort)
    needs: prepare
    runs-on: macos-latest
    continue-on-error: true # aláírás nélkül nem készül feltölthető IPA — nem blokkolja a kiadást
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projekt generálása
        working-directory: ios
        run: xcodegen generate
      - name: Fordítás ellenőrzése (iOS szimulátor, aláírás nélkül)
        working-directory: ios
        run: |
          xcodebuild -project Breaker.xcodeproj -scheme BreakerApp-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release build \
            CODE_SIGNING_ALLOWED=NO | tail -30
      # Opcionális: TestFlight feltöltés. Csak akkor fut, ha be van állítva az
      # App Store Connect API-kulcs (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8).
      # Ehhez érvényes provisioning + DEVELOPMENT_TEAM is kell (lásd docs).
      - name: Archív + TestFlight (ha van ASC kulcs)
        if: ${{ env.ASC_KEY_ID != '' }}
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild -project Breaker.xcodeproj -scheme BreakerApp-iOS \
            -configuration Release -archivePath "$RUNNER_TEMP/Breaker.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Breaker.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

  publish:
    name: Release élesítése
    needs: [desktop, android]
    # Az asztali telepítők a feltétel: ha az Android job elhasal, a kiadás
    # attól még menjen ki (különben egy mobil hiba miatt a Mac/Windows
    # letöltés is draftban ragadna, és a letöltőoldal üresen maradna).
    # A !cancelled() fontos: az always() a MEGSZAKÍTOTT futásra is igaz, így egy
    # félbehagyott kiadás élesítette a draftot a félkész fájlokkal (v0.1.1).
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft -> közzététel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
