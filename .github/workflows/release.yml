name: Release

# Új verzió kiadása: nyomj egy verziócímkét, a többi automatikus.
#   git tag v0.2.0 && git push origin v0.2.0
#
# Létrejön egy GitHub Release a telepítőkkel, és a már telepített appok
# (asztali + Android közvetlen terjesztés) automatikusan felfrissülnek rá.

on:
  push:
    tags: ["v*"]
  # Kézi indítás is: Actions -> Release -> Run workflow -> verzió megadása.
  # Ugyanazt csinálja, mint a címke-push, csak nem kell hozzá terminál.
  workflow_dispatch:
    inputs:
      version:
        description: "Verziócímke (pl. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  # Címke-pushnál a címke neve, kézi indításnál a megadott verzió.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  prepare:
    name: Draft release létrehozása
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Breaker $VERSION" \
              --notes-file - <<'NOTES'
          ## Mi újság ebben a verzióban

          **A munkamenet mostantól a telefonodon is érvényes.** Eddig csak a
          gépen létezett, és ez a funkció felét elvette: elindítottad a
          „Nyelvtanulás” csomagot, felvetted a telefont, és ott minden mehetett.
          Egy fehérlistánál pont az az eszköz maradt ki, ami kéznél van.

          A csomagok és a futó menet mostantól átutaznak a fiókodon, és a telefon
          DNS-szűrője **tényleg betartatja** a fehérlistát: ami nincs a csomagon,
          az nem jön be.

          **Telefonon ez ERŐSEBB, mint gépen** — és ez nem hangzatos állítás,
          hanem a mechanizmus. A gépen a hosts fájlba nem írható le, hogy
          „mindent tilts, kivéve ötöt” (a világ összes nevét kellene felsorolni),
          ezért ott ehhez böngésző-bővítmény kell. A telefonos alagút viszont
          MINDEN névfeloldást lát.

          **Van egy szűk kivétellista, és nem titkoljuk.** Egy telefon, aminek
          minden névfeloldása elhasal, nem korlátozott telefon, hanem
          használhatatlan: nem jön értesítés, a rendszer azt hiszi, nincs
          internet, és nem a beállításodat hibáztatnád, hanem az appot. Ezért
          átmegy az értesítés-kézbesítés, a kapcsolat-ellenőrzés, az óra, és a
          saját fiókkiszolgálód — ez utóbbi azért, hogy a telefon lássa, ha egy
          MÁSIK eszközön leállítod a menetet. Böngészni egyiken sem lehet.

          **Indítani egyelőre a gépen lehet**, és ez szándékos, nem félkész.
          Indítani ingyen van, leállítani viszont próbatétel — ha a telefon
          tudna indítani, de leállítani nem, egy nyolcórás menetből ott nem
          lenne kiút. A telefonos indítás a próbatétel-motor teljes tükrével
          együtt jön, egyben. Kiút addig is van, és nem titok: a rendszer
          VPN-kapcsolója erősebb az appnál.

          Amit a gépi ellenőrzés NEM fed, és ezt sem hallgatjuk el: a tényleges
          alagút-viselkedés csak igazi készüléken derül ki. A logika és a
          fordítás le van fedve; VPN-t a CI nem futtat.

          ### Ami a v0.4.2-ben jött

          **A munkamenet hossza percre pontos.** Eddig csak a felkínált
          gombokból lehetett választani (15 / 25 / 50 / 90 / 120 perc). Aki
          tudja, hogy negyvenhárom perce van ebédig, az kénytelen volt fölé
          vagy alá lőni — és egy önkontroll-appnál a „nagyjából annyi” pont a
          rossz irány: fölé lőve leállítani akarsz, és az próbatétel; alá lőve
          lejár, mielőtt kész lennél.

          Mostantól a gyorsgombok mellett ott a szabad mező, mindenhol, ahol
          percet kell megadni:

          - munkamenet indítása — az appban **és** a gyorsbillentyűs rétegben,
          - hosszabbítás menet közben (a hosszabbítás szigorítás, ezért ingyen),
          - a csomag szokásos hossza — ez eddig fixen ötven perc volt, és sehol
            nem lehetett átállítani,
          - **napi keret** oldalanként.

          A feloldás („szünet”) hossza szándékosan marad a 15 / 30 / 60 perces
          listán: az lazítás, és ha szabadon megadható lenne, ugyanannak az egy
          próbatételnek az árán lehetne nyolc órát kérni.

          **A futó munkamenet mostantól minden nézetből látszik.** Eddig csak a
          Munkamenetek fülön: a másik két fülről nézve az app úgy nézett ki,
          mintha nem menne semmi — és amikor egy oldal nem jött be, a
          felhasználó a hibát kereste, nem a munkamenetet. Egy fehérlistás
          munkamenetnél ez a legrosszabb tévedés. Most a fejlécben áll, a
          csomag nevével és a hátralévő idővel, és rákattintva odavisz. A futó
          munkamenet doboza a végét is kiírja („eddig: 14:32”), nem csak azt,
          mennyi van hátra.

          #### Akkor javítva

          - **A futó csomag „Szerkesztés” gombja mindig hibára futott.** A gomb
            aktív volt, a háttérszolgáltatás viszont a futó csomag mentését
            visszautasítja — a felület tehát felkínált egy szerkesztőt, amiből
            a Mentés sosem ment át. Most letiltva, és a buborékja megmondja,
            miért fagy be a futó csomag.
          - **A csomag törlése egyetlen kattintás volt.** Egy gondosan
            összerakott fehérlista ne tűnjön el félrekattintásra: két lépés
            lett.
          - **A hosszkorlátokról semmi nem szólt.** A csomag nevét negyven
            karakternél, a listákat negyven tételnél vágja le a
            háttérszolgáltatás — eddig mentés után egyszerűen egy másik
            csomagot kaptál vissza, magyarázat nélkül. Most korlátozott mező és
            számláló van.
          - **A gyorsbillentyűs réteg üres állapota zsákutca volt:** megmondta,
            hogy az appban kell csomagot felvenni, de nem vitt oda. Most van
            rajta gomb, ami megnyitja az appot.
          - **A kiválasztott hossz-gombra nem jött visszajelzés,** és a kis
            feliratok akkorák voltak, mint a törzsszöveg: két stílus hiányzott,
            amit a felület egyébként használt.

          ### Ami a v0.4.1-ben jött

          **Felső menüsor — nincs több tekerés.** Eddig minden egymás alatt volt
          egyetlen hosszú lapon: a fiókhoz a képernyő aljáig kellett görgetni, és
          a statisztika meg a blokklista egymást takarta. Mostantól három fül van
          a fejlécben — **Oldalak · Munkamenetek · Statisztika** —, és egyszerre
          egy dolog van a képernyőn.

          **A fiók a jobb felső sarokban van, egy ikon mögött.** Rákattintva
          oldalról benyílik. Az ikonból az is látszik, hogy be vagy-e lépve:
          kijelentkezve egy alak, belépve a fiókazonosítód kezdőbetűje. Az Esc
          bezárja — ami csak egérrel csukható, az billentyűzettel csapdába ejt.

          **A kinézet testreszabható.** A fiók melletti ikon nyitja: négyféle
          háttér (Nyugalom, Aurora, Rács, Tiszta), és külön kapcsoló arra, hogy
          mozogjon-e. Aki zavarónak találja a mozgást, megállíthatja, a hátteret
          viszont megtarthatja. Ha a rendszeredben be van kapcsolva a
          „csökkentett mozgás”, az erősebb ennél a kapcsolónál.

          A választás a gépeden marad. A NÉZET viszont szándékosan nem: az app
          mindig az Oldalak nézettel nyílik, mert a blokklista az, amiért az app
          van.

          #### Akkor javítva

          - **A munkameneteknél az „Új csomag” gomb nem csinált semmit.** A gomb
            ott volt, kezelő viszont nem tartozott hozzá: rá lehetett kattintani,
            és nem történt semmi. A funkció így elérhetetlen volt — az egyetlen
            út a gyorsbillentyűs rétegen át vezetett, ahol viszont csomagot
            felvenni nem lehet.

          ### Ami a v0.4.0-ban jött

          **Teljesen új felület.** Nem átszínezés: a hierarchiát mostantól a
          tipográfia és a térköz adja, nem a keretek. Eddig minden be volt
          keretezve — kártya a kártyában, sor a sorban —, és attól minden
          ugyanolyan fontosnak látszott. Most az oldalak egyetlen kártyán
          belül, hajszálvonallal elválasztva élnek, a szakaszcímek
          visszahúzódnak, és képernyőnként egy hangsúlyos elem van. Mind a négy
          felület (Windows, macOS, Android, iPhone) ugyanabból a rendszerből
          épül, ugyanazokkal a számokkal.

          Az **ikon** is új, és a jel végre azt mondja, amit az app csinál: egy
          megszakított gyűrű — a kör, ami nem zárul be. Nem lakat: itt nem
          őrizni kell valamit, hanem te magad zárod ki magad.

          **A fiókhoz nem kell többé IP-címet begépelni.** Ez volt az a pont,
          ahol a szinkron meghalt: fiókot csinálni csak úgy lehetett, ha előbb
          beírtad, hogy `http://192.168.1.10:8787`. Mostantól:

          - **A gépen hagyd üresen a mezőt.** Az üres mező azt jelenti, hogy a
            fiók ezen a gépen legyen: a kiszolgáló magától elindul, és az app a
            saját helyi címét használja. Semmit nem kell megkeresned.
          - **A telefonon egy rövid kód elég.** A gép kiírja, például `00GMR` —
            öt karakter, nem egy IP-cím. Kötőjel, szóköz és kisbetű nem
            számít, és ha elgépeled, azt a kód maga mondja meg (ellenőrző
            összeg van benne), nem egy értelmezhetetlen „nem érhető el”.

          **Részleges tiltás: nem az egész oldal, csak egy darabja.** Például a
          YouTube-on egy-egy csatorna. Ezt a Breaker DNS-motorja **nem tudja
          megcsinálni**, és ez nem hiányzó munka: a DNS csak a hosztnevet látja
          (`youtube.com`), az utat (`/@valaki`) nem — az már a titkosított
          kérésen belül van. Ami a teljes címet látja, az maga a böngésző, ezért
          ehhez egy **böngésző-bővítmény** jár (a kiadás mellett,
          `Breaker-bovitmeny-*.zip`).

          Cserébe **gyengébb réteg, és ezt ki is mondjuk**: csak abban a
          böngészőben él, ahova telepítve van; vendég módban egyáltalán nem fut;
          inkognitóban alapból ki van kapcsolva. A teljes oldal tiltása marad
          DNS-szintű és megkerülhetetlen — ez az **ingert** veszi el, nem a
          hozzáférést.

          A bővítmény nem csak a megnyitást állítja meg: a csatorna videóit a
          főoldali ajánlóból is eltünteti. A szabályokat az appban is fel lehet
          venni, oldalanként; felvenni egy kattintás, **levenni próbatétel** —
          ugyanúgy, mint a feloldást.

          **Munkamenetek: „most csak ez mehet”.** A blokklista arról szól, mi
          NE menjen. Van azonban egy másik igény, ami ellentétes irányból
          közelít: leülsz nyelvet tanulni, és a következő ötven percben csak a
          szótár és a jegyzetfüzet kell. Mindent felsorolni, ami zavarhat,
          reménytelen — a világon minden zavarhat. Felsorolni, ami kell: öt
          tétel. A munkamenet ezért **fehérlista**.

          Csinálsz egy csomagot (például „Nyelvtanulás”), felsorolod, mi mehet
          alatta, és indításkor megadod, meddig tartson. Amíg tart, minden más
          tiltva.

          Az egész azon áll, hogy **egy mozdulattal induljon**: aki leül
          tanulni, nem fog előbb ablakot keresni és fület váltani — addigra már
          a YouTube-on van. Ezért van **gyorsbillentyűs réteg** (⌘⌥B Macen,
          Ctrl+Alt+B Windowson): rááll arra, amit épp csinálsz, és
          számbillentyűvel indít. Az Esc bezárja.

          A súrlódás iránya itt is ugyanaz: **indítani és hosszabbítani ingyen
          van, leállítani próbatétel**. A futó csomag közben nem szerkeszthető —
          enélkül a fehérlistához menet közben hozzá lehetne adni bármit, és a
          munkamenet önmagát oldaná fel. Egyszerre egy munkamenet fut, mert
          különben elég lenne indítani egy „minden engedve” csomagot.

          Amit ez a réteg **tud és nem tud**, kimondva: a fehérlistát a
          böngésző-bővítmény érvényesíti, mert csak ott látszik a teljes cím. Az
          appoknál a mérés látja, mi van előtérben, és a felület figyelmeztet —
          egy futó programot nem lövünk ki, és nem is állítjuk, hogy tudunk.

          Ha bezárod az appot, a munkamenet **a saját idejéig akkor is tart** —
          bezárni nem feloldás. De egy perccel sem tovább.

          **A napi keret mostantól KÖZÖS az eszközeid között.** Eddig
          eszközönként külön ketyegett: a „napi 20 perc YouTube” a gépen húsz
          percet jelentett, a telefonon még húszat — két eszközzel negyven,
          hárommal hatvan. Aki a keretet komolyan gondolta, annak ez nem keret
          volt, hanem javaslat. Most minden eszköz feltölti, mennyit mért ma
          (titkosítva, pár száz bájt), és mindegyik hozzáadja a többiét a
          sajátjához. A mérő alatt oda is van írva, mennyi ment el máshol.

          Ezzel **iPhone-on végre ér is valamit a napi keret**. Eddig a
          beállítás átment a szinkronon, de a telefonon soha semmi nem nézte
          meg: aki a gépen napi húsz percet állított be, az a telefonján
          korlátlanul használhatta ugyanazt az oldalt. Mérni ott továbbra sem
          tudunk (az Apple nem enged hozzá), de ha a keret a gépen elfogyott,
          az oldal az iPhone-on is zárva van.

          **Az összes eszközöd ideje egyben.** A fiókkártyán legelöl az áll,
          hogy mennyi ment el ÖSSZESEN — nem eszközönként külön. Két eszközön
          napi húsz-húsz perc az együtt negyven, és fejben ezt senki nem adja
          össze. Alatta eszközönként a mai és a heti idő, meg a hét három
          legtöbb időt vivő célpontja.

          **iPhone-on ez az egyetlen statisztika, ami valaha látszani fog.** Az
          Apple nem enged appnak hozzáférni ahhoz, hogy más appokban vagy
          weboldalakon mennyi aktív idő telik, tehát a készülék maga semmit nem
          mér. Amit viszont megtehet: elolvasni, amit a géped és az androidos
          telefonod mért.

          Ha rejtve van a lista, az összesített sor sem nevezi meg az oldalt:
          ugyanaz a fedőnév vagy `1. rejtett oldal` áll ott is.

          ### Ami korábbról már megvolt

          **Fedőnév a blokkolt oldalakhoz** — a lista maga is ingerforrás.
          Minden oldalnak adható saját név; a valódi cím egy gombbal hat
          másodpercre előhívható.

          **A teljes lista elrejthető** — az app minden induláskor csukott
          listával nyílik, csak a darabszám látszik.

          **Fiók és eszközök közti szinkron** mind a három platformon, végponttól
          végpontig titkosítva: a kiszolgáló nem látja a blokklistádat és a mért
          idődet. A kiszolgáló néhány száz sor, függőség nélkül, magadnak is
          futtathatod (`server/`), de a legegyszerűbb, ha az asztali app
          indítja el. Elfelejtett jelszóhoz a regisztrációnál kapott
          helyreállító kód az út vissza.

          **Napi időkeret oldalanként** (ebben a verzióban lett közös az
          eszközök között — lásd fentebb), **időzített menetrend**, és
          **próbatételek**, amik nem lesznek könnyebbek attól, hogy sokszor
          oldasz fel.

          ### Régebbi javítások

          - **Telefonon a helyi kiszolgáló nem volt elérhető.** Android 9-től és
            iOS-en a titkosítatlan HTTP alapból tiltott, így a saját hálózaton
            futó kiszolgáló címe szó nélkül elhasalt. Mostantól a HELYI hálózat
            engedélyezett — az internet felé mindkét app továbbra is HTTPS-t vár.
          - **Az automatikus szinkron hurkolt.** A kör végén mentett, a mentés
            pedig ütemezett egy újabb kört: a háttérszolgáltatás húsz
            másodpercenként verte volna a kiszolgálót. Az ütemezés külön, tesztelt
            részbe került.
          - **A jelszóra alsó hosszkorlát került (10 karakter).** Ez a jelszó
            nem egy weboldal belépője: ez tartja a kulcsot, ami az adatot
            nyitja.

          ## Névváltás: a Lakatból Breaker lett

          Ha van fent **Lakat** (v0.1.x), azt a rendszer MÁS appnak látja: a
          Breaker nem frissítésként érkezik mellé, és a régi háttérszolgáltatás
          magától tovább futna — a hosts fájlban lévő blokkjával együtt.

          A Breaker telepítése után futtasd le egyszer, Terminálban:

          ```
          sudo launchctl bootout system/hu.lakat.helper
          sudo rm -f /Library/LaunchDaemons/hu.lakat.helper.plist
          sudo rm -rf "/Library/Application Support/Lakat" /Library/Logs/Lakat
          rm -rf /Applications/Lakat.app
          ```

          Windowson a régi ütemezett feladat: `schtasks /Delete /TN "LakatHelper" /F`.
          Androidon egyszerűen töröld a régi appot.

          A hosts fájlt **nem kell** kézzel javítani: a Breaker az első
          blokkolásnál kitakarítja a régi néven írt sorokat is.

          ## Letöltés

          | Gép | Fájl |
          |---|---|
          | **Mac (Apple szilícium, M1/M2/M3…)** | `…-arm64.dmg` |
          | **Mac (Intel)** | `….dmg` (arm64 nélkül) |
          | **Windows** | `….exe` |
          | **Android** | `Breaker-*.apk` |

          ### macOS — első indítás (fontos!)
          Amíg nincs Apple fejlesztői aláírás, a **macOS 15 (Sequoia) és újabb**
          nem elégszik meg a régi „jobb gomb → Megnyitás” trükkel: kukába teszi az
          appot *„Rosszindulatú szoftver blokkolva”* üzenettel. Ez nem valódi
          kártevőt jelent — csak azt, hogy az app nincs aláírva és közjegyzőzve.

          Így megy mégis, két lépésben:

          1. Töltsd le a **DMG**-t (ne a `-mac.zip`-et, az a frissítéshez van),
             nyisd meg, és húzd a **Programok** mappába.
          2. Nyiss egy Terminált (Spotlight → „Terminál”), és futtasd:

          ```
          xattr -dr com.apple.quarantine /Applications/Breaker.app
          ```

          Ezután a Breaker sima duplakattintással indul. Ha a rendszer már kukába
          tette, előbb húzd vissza a kukából a Programok mappába, aztán futtasd a
          parancsot.

          A parancs a **letöltési karantén jelzőt** veszi le arról az appról, amit
          te magad töltöttél le — semmi mást nem kapcsol ki a gépeden.

          ### Frissítés
          A telepített app magától megnézi, van-e újabb verzió, letölti a háttérben,
          és egy gombnyomásra újraindulva már az újat futtatja — Windowson és
          macOS-en is, Apple-tanúsítvány nélkül is.

          Frissítés után megjelenhet egy sáv arról, hogy a háttérszolgáltatás még a
          régi verzió. Ez normális — a blokkolást végző szolgáltatást a rendszer
          csak újraindításkor cserélné le magától. A sávban lévő gomb egy
          jelszókérés árán, azonnal lecseréli. Amíg nem teszed meg, a blokkolás
          változatlanul működik, csak a legújabb beállítások nem biztos, hogy
          érvényesülnek.
          NOTES
          fi

  desktop:
    name: Asztali telepítő (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Verzió beállítása a tagből
        shell: bash
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - name: Build + publish (electron-builder)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # FIGYELEM: az aláíró változókat NEM közvetlenül a hivatalos nevükön
          # adjuk át. A GitHub a hiányzó secretet üres sztringre állítja, az
          # electron-builder viszont csak azt nézi, hogy DEFINIÁLVA van-e a
          # CSC_LINK — üresen is tanúsítványként próbálja megnyitni, és a build
          # „not a file” hibával elszáll. Ezért saját néven jönnek be, és csak
          # akkor exportáljuk őket, ha tényleg van értékük.
          SIGN_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SIGN_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SIGN_WIN_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGN_WIN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$SIGN_CSC_LINK" ]; then
              export CSC_LINK="$SIGN_CSC_LINK"
              export CSC_KEY_PASSWORD="$SIGN_CSC_KEY_PASSWORD"
            else
              # Aláírás nélkül ne is keressen tanúsítványt a kulcskarikán.
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
            if [ -n "$SIGN_APPLE_ID" ]; then
              export APPLE_ID="$SIGN_APPLE_ID"
              export APPLE_APP_SPECIFIC_PASSWORD="$SIGN_APPLE_APP_SPECIFIC_PASSWORD"
              export APPLE_TEAM_ID="$SIGN_APPLE_TEAM_ID"
            fi
          else
            if [ -n "$SIGN_WIN_CSC_LINK" ]; then
              export CSC_LINK="$SIGN_WIN_CSC_LINK"
              export CSC_KEY_PASSWORD="$SIGN_WIN_CSC_KEY_PASSWORD"
            fi
          fi
          npm run dist -- --publish always
      # Az electron-builder publishere CSENDBEN kihagyja a feltöltést, ha a
      # release már nem draft („existing type not compatible”) — a job attól
      # még sikeresnek látszik, és a kiadáson egy korábbi build fájljai
      # maradnak. Pontosan ez történt a v0.1.1-nél: egy megszakított futás
      # feltöltötte az aláíratlan DMG-ket, az újraépítés jóit meg eldobta.
      # Ezért a build UTÁN mindig felül is írjuk, amit most építettünk —
      # ugyanazzal a --clobber feltöltéssel, amit az Android job is használ.
      - name: Assetek feltöltése (felülírással)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Sima POSIX-glob, semmi bashizmus: a macOS futtatók /bin/bash-a 3.2,
          # ott nincs mapfile.
          set -eu
          cd release
          installers=0
          for f in *.dmg *.exe *-mac.zip *.blockmap latest*.yml; do
            [ -f "$f" ] || continue          # a nem illeszkedő glob önmagát adja
            # A szóközös nevet a GitHub pontokra cseréli, az electron-builder
            # publishere viszont kötőjelesre — így UGYANAZ a telepítő kétszer
            # került fel, két néven (v0.1.2). Előbb kötőjelesítünk, hogy a
            # --clobber tényleg ugyanarra az assetre üssön.
            case "$f" in
              *\ *) t=$(echo "$f" | tr " " "-"); mv -f "$f" "$t"; f="$t" ;;
            esac
            case "$f" in *.dmg|*.exe) installers=$((installers + 1)) ;; esac
            echo "feltöltés: $f"
            gh release upload "$VERSION" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          [ "$installers" -gt 0 ] || { echo "nem épült telepítő" >&2; exit 1; }
          # A frissítés ezen a manifesten áll vagy bukik; ha nincs, ne adjunk ki
          # olyan verziót, amire a telepített appok nem tudnak felfrissülni.
          ls latest*.yml >/dev/null

  extension:
    name: Böngésző-bővítmény (zip)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Csomagolatlanul is betölthető a mappa, de csak akkor, ha valaki
      # klónozza a projektet. Egy zip a kiadás mellé annyit jelent, hogy a
      # letöltőoldalról is elérhető — enélkül a funkció papíron létezne.
      - name: Zip
        run: |
          cd extension
          zip -r "../Breaker-bovitmeny-${VERSION}.zip" . -x '*.DS_Store'
      - name: Feltöltés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$VERSION" "Breaker-bovitmeny-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android APK + AAB
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Aláíró kulcs visszaállítása (ha van secret)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi
      - run: chmod +x gradlew
      - name: Build (APK a közvetlen terjesztéshez, AAB a Play Store-hoz)
        env:
          BREAKER_KEYSTORE: ${{ steps.keystore.outputs.path }}
          BREAKER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BREAKER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BREAKER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BREAKER_VERSION_NAME: ${{ env.VERSION }}
          BREAKER_VERSION_CODE: ${{ github.run_number }}
        run: |
          export BREAKER_VERSION_NAME="${BREAKER_VERSION_NAME#v}"
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Assetek átnevezése és feltöltése
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n1)
          cp "$APK" "Breaker-${VERSION}.apk"
          gh release upload "$VERSION" "Breaker-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          if [ -n "$AAB" ]; then
            cp "$AAB" "Breaker-${VERSION}.aab"
            gh release upload "$VERSION" "Breaker-${VERSION}.aab" --repo "$GITHUB_REPOSITORY" --clobber
          fi
      # Opcionális: automatikus Play Store feltöltés az internal track-re. Csak
      # akkor fut, ha be van állítva a PLAY_SERVICE_ACCOUNT_JSON secret.
      - name: Play Store feltöltés (ha van service account)
        if: ${{ env.PLAY_JSON != '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: hu.breaker.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

  ios:
    name: iOS/macOS archívum (best-effort)
    needs: prepare
    runs-on: macos-latest
    continue-on-error: true # aláírás nélkül nem készül feltölthető IPA — nem blokkolja a kiadást
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projekt generálása
        working-directory: ios
        run: xcodegen generate
      - name: Fordítás ellenőrzése (iOS szimulátor, aláírás nélkül)
        working-directory: ios
        run: |
          xcodebuild -project Breaker.xcodeproj -scheme BreakerApp-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release build \
            CODE_SIGNING_ALLOWED=NO | tail -30
      # Opcionális: TestFlight feltöltés. Csak akkor fut, ha be van állítva az
      # App Store Connect API-kulcs (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8).
      # Ehhez érvényes provisioning + DEVELOPMENT_TEAM is kell (lásd docs).
      - name: Archív + TestFlight (ha van ASC kulcs)
        if: ${{ env.ASC_KEY_ID != '' }}
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild -project Breaker.xcodeproj -scheme BreakerApp-iOS \
            -configuration Release -archivePath "$RUNNER_TEMP/Breaker.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Breaker.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

  publish:
    name: Release élesítése
    needs: [desktop, android]
    # Az asztali telepítők a feltétel: ha az Android job elhasal, a kiadás
    # attól még menjen ki (különben egy mobil hiba miatt a Mac/Windows
    # letöltés is draftban ragadna, és a letöltőoldal üresen maradna).
    # A !cancelled() fontos: az always() a MEGSZAKÍTOTT futásra is igaz, így egy
    # félbehagyott kiadás élesítette a draftot a félkész fájlokkal (v0.1.1).
    if: ${{ !cancelled() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft -> közzététel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
