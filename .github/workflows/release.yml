name: Release

# Új verzió kiadása: nyomj egy verziócímkét, a többi automatikus.
#   git tag v0.2.0 && git push origin v0.2.0
#
# Létrejön egy GitHub Release a telepítőkkel, és a már telepített appok
# (asztali + Android közvetlen terjesztés) automatikusan felfrissülnek rá.

on:
  push:
    tags: ["v*"]
  # Kézi indítás is: Actions -> Release -> Run workflow -> verzió megadása.
  # Ugyanazt csinálja, mint a címke-push, csak nem kell hozzá terminál.
  workflow_dispatch:
    inputs:
      version:
        description: "Verziócímke (pl. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  # Címke-pushnál a címke neve, kézi indításnál a megadott verzió.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  prepare:
    name: Draft release létrehozása
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Lakat $VERSION" \
              --notes-file - <<'NOTES'
          ## Letöltés

          | Gép | Fájl |
          |---|---|
          | **Mac (Apple szilícium, M1/M2/M3…)** | `…-arm64.dmg` |
          | **Mac (Intel)** | `….dmg` (arm64 nélkül) |
          | **Windows** | `….exe` |
          | **Android** | `Lakat-*.apk` |

          ### macOS — első indítás
          Nyisd meg a DMG-t, húzd a **Programok** mappába, majd a Lakat ikonon
          **jobb gomb → Megnyitás**, és a párbeszédben újra **Megnyitás**. Ezt csak
          egyszer kell: amíg nincs Apple fejlesztői aláírás, a Gatekeeper ismeretlen
          fejlesztőként kezeli az appot. Ha „sérült” hibát írna, a letöltési karantén
          jelzőt kell levenni:
          `xattr -dr com.apple.quarantine /Applications/Lakat.app`

          ### Frissítés
          A telepített app magától megnézi, van-e újabb verzió, letölti a háttérben,
          és egy gombnyomásra újraindulva már az újat futtatja — Windowson és
          macOS-en is, Apple-tanúsítvány nélkül is.
          NOTES
          fi

  desktop:
    name: Asztali telepítő (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Verzió beállítása a tagből
        shell: bash
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - name: Build + publish (electron-builder)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # FIGYELEM: az aláíró változókat NEM közvetlenül a hivatalos nevükön
          # adjuk át. A GitHub a hiányzó secretet üres sztringre állítja, az
          # electron-builder viszont csak azt nézi, hogy DEFINIÁLVA van-e a
          # CSC_LINK — üresen is tanúsítványként próbálja megnyitni, és a build
          # „not a file” hibával elszáll. Ezért saját néven jönnek be, és csak
          # akkor exportáljuk őket, ha tényleg van értékük.
          SIGN_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          SIGN_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SIGN_WIN_CSC_LINK: ${{ secrets.CSC_LINK }}
          SIGN_WIN_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
          SIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$SIGN_CSC_LINK" ]; then
              export CSC_LINK="$SIGN_CSC_LINK"
              export CSC_KEY_PASSWORD="$SIGN_CSC_KEY_PASSWORD"
            else
              # Aláírás nélkül ne is keressen tanúsítványt a kulcskarikán.
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
            if [ -n "$SIGN_APPLE_ID" ]; then
              export APPLE_ID="$SIGN_APPLE_ID"
              export APPLE_APP_SPECIFIC_PASSWORD="$SIGN_APPLE_APP_SPECIFIC_PASSWORD"
              export APPLE_TEAM_ID="$SIGN_APPLE_TEAM_ID"
            fi
          else
            if [ -n "$SIGN_WIN_CSC_LINK" ]; then
              export CSC_LINK="$SIGN_WIN_CSC_LINK"
              export CSC_KEY_PASSWORD="$SIGN_WIN_CSC_KEY_PASSWORD"
            fi
          fi
          npm run dist -- --publish always

  android:
    name: Android APK + AAB
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Aláíró kulcs visszaállítása (ha van secret)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi
      - run: chmod +x gradlew
      - name: Build (APK a közvetlen terjesztéshez, AAB a Play Store-hoz)
        env:
          LAKAT_KEYSTORE: ${{ steps.keystore.outputs.path }}
          LAKAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LAKAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAKAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LAKAT_VERSION_NAME: ${{ env.VERSION }}
          LAKAT_VERSION_CODE: ${{ github.run_number }}
        run: |
          export LAKAT_VERSION_NAME="${LAKAT_VERSION_NAME#v}"
          ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Assetek átnevezése és feltöltése
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n1)
          cp "$APK" "Lakat-${VERSION}.apk"
          gh release upload "$VERSION" "Lakat-${VERSION}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          if [ -n "$AAB" ]; then
            cp "$AAB" "Lakat-${VERSION}.aab"
            gh release upload "$VERSION" "Lakat-${VERSION}.aab" --repo "$GITHUB_REPOSITORY" --clobber
          fi
      # Opcionális: automatikus Play Store feltöltés az internal track-re. Csak
      # akkor fut, ha be van állítva a PLAY_SERVICE_ACCOUNT_JSON secret.
      - name: Play Store feltöltés (ha van service account)
        if: ${{ env.PLAY_JSON != '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: hu.lakat.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

  ios:
    name: iOS/macOS archívum (best-effort)
    needs: prepare
    runs-on: macos-latest
    continue-on-error: true # aláírás nélkül nem készül feltölthető IPA — nem blokkolja a kiadást
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projekt generálása
        working-directory: ios
        run: xcodegen generate
      - name: Fordítás ellenőrzése (iOS szimulátor, aláírás nélkül)
        working-directory: ios
        run: |
          xcodebuild -project Lakat.xcodeproj -scheme LakatApp-iOS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release build \
            CODE_SIGNING_ALLOWED=NO | tail -30
      # Opcionális: TestFlight feltöltés. Csak akkor fut, ha be van állítva az
      # App Store Connect API-kulcs (ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8).
      # Ehhez érvényes provisioning + DEVELOPMENT_TEAM is kell (lásd docs).
      - name: Archív + TestFlight (ha van ASC kulcs)
        if: ${{ env.ASC_KEY_ID != '' }}
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild -project Lakat.xcodeproj -scheme LakatApp-iOS \
            -configuration Release -archivePath "$RUNNER_TEMP/Lakat.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Lakat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

  publish:
    name: Release élesítése
    needs: [desktop, android]
    # Az asztali telepítők a feltétel: ha az Android job elhasal, a kiadás
    # attól még menjen ki (különben egy mobil hiba miatt a Mac/Windows
    # letöltés is draftban ragadna, és a letöltőoldal üresen maradna).
    if: ${{ always() && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draft -> közzététel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
