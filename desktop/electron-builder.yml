appId: hu.lakat.app
productName: Lakat
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # Aláírás + közjegyzőzés (notarization) nélkül a Gatekeeper első indításkor
  # figyelmeztet. Fejlesztői tanúsítvánnyal töltsd ki:
  # identity: "Developer ID Application: ..."
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
