appId: hu.breaker.app
productName: Breaker
directories:
  output: release
files:
  - dist/**
  - package.json
  - node_modules/**
asar: true

# A böngésző-bővítmény az app részeként érkezik: induláskor az app kimásolja
# a userData/extension mappába, és frissíti, ha a tartalma változott (lásd
# src/main/extension-folder.ts). A böngészőbe ezt a mappát kell EGYSZER
# betölteni. A README nem kell a felhasználó gépére.
extraResources:
  - from: ../extension
    to: extension
    filter:
      - "**/*"
      - "!README.md"

# Aláírás-utómunka: tanúsítvány nélkül ad-hoc aláírjuk a macOS bundle-t,
# különben Apple szilíciumon el sem indul. Lásd scripts/after-pack.js.
afterPack: scripts/after-pack.js

# Automatikus frissítés forrása: GitHub Releases. A `gh` tulajdonos/repo a
# CI-ban a GH_TOKEN-ből is jön; itt rögzítjük az alapértelmezettet.
publish:
  provider: github
  owner: David-Getta
  repo: app_blocker
mac:
  category: public.app-category.productivity
  # Mindkét architektúra kell: a GitHub macOS futtatója ma Apple szilícium,
  # és arch megadása nélkül CSAK arm64 telepítő készülne — egy Intel Mac-en
  # az le sem futna. Külön arm64 és x64 csomag (nem universal), mert az
  # universal build kétszer akkora letöltés mindkét gépnek.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # The active-time tracker asks System Events / the browser for the frontmost
  # app and active tab via Apple Events. Without this usage string TCC denies the
  # request outright in a packaged build and measurement silently records
  # nothing; with it, macOS shows the user a one-time consent prompt.
  extendInfo:
    NSAppleEventsUsageDescription: >-
      A Breaker ezzel kérdezi le, melyik alkalmazás van előtérben és melyik
      weboldal az aktív fül, hogy a képernyőidő-statisztikát elkészítse.
      Az adat a gépeden marad.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Az Electron 44 a macOS 13-at (Ventura) kéri: régebbin el sem indul.
  minimumSystemVersion: "13.0"
  # A FRISSÍTŐ-CSOMAG (zip) neve hordozza ezt a követelményt: -darwin13.zip.
  # A v0.4.241 óta minden app ebből olvassa ki, hogy régebbi macOS-en NE
  # frissítsen rá (src/shared/update-manifest.ts, pickMacUpdate) — és a név
  # szándékosan nem tartalmazza a „mac” szót, mert a v0.4.240-ig kiadott
  # frissítők minden ilyen zipet felraknának, egy macOS 12-es gépre is. Ha a
  # követelmény nő, a szám itt és a minimumSystemVersion-ben együtt nő.
  artifactName: ${productName}-${version}-${arch}-darwin13.${ext}
# A telepítő (dmg) neve a rendszerkövetelmény nélküli, megszokott alak — csak
# az x64-é kapja meg mostantól az architektúrát is a nevébe (a felhasználó által
# megadott névben az electron-builder nem hagyja el).
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Aláírás + közjegyzőzés (notarization) nélkül a Gatekeeper első indításkor
  # figyelmeztet. Fejlesztői tanúsítvánnyal töltsd ki:
  # identity: "Developer ID Application: ..."
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  # Az eltávolító a felhasználó saját Start menüjéből is leveszi a Breaker
  # parancsikont és az értesítés-kattintás HKCU-bejegyzését — ezeket az
  # Electron 41 óta maga az app teszi le az első értesítéskor. Lásd ott.
  include: build/installer.nsh
