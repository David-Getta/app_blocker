appId: hu.lakat.app
productName: Lakat
directories:
  output: release
files:
  - dist/**
  - package.json
  - node_modules/**
asar: true

# Automatikus frissítés forrása: GitHub Releases. A `gh` tulajdonos/repo a
# CI-ban a GH_TOKEN-ből is jön; itt rögzítjük az alapértelmezettet.
publish:
  provider: github
  owner: David-Getta
  repo: app_blocker
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # Aláírás + közjegyzőzés (notarization) nélkül a Gatekeeper első indításkor
  # figyelmeztet. Fejlesztői tanúsítvánnyal töltsd ki:
  # identity: "Developer ID Application: ..."
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
